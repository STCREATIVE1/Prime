name: Scrape Prime Video Live TV Guide

on:
  schedule:
    # Har 6 ghante baad auto-run hoga (UTC)
    - cron: '0 */6 * * *'
  # GitHub Actions tab se manually run karne ke liye
  workflow_dispatch:

jobs:
  scrape-prime-guide:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium --with-deps

      - name: Run Prime Live TV Scraper
        run: |
          python prime_livetv.py

      - name: Commit and Push JSON Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add prime_livetv.json
          
          # Sirf tab commit karega jab data mein koi update hoga
          if git diff --staged --quiet; then
            echo "No new updates found. Skipping commit."
          else
            git commit -m "chore: update prime video livetv guide [skip ci]"
            git push
          fi
          
